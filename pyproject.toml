[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory-diffusion"
version = "0.1.0"
description = "Task-calibrated few-step sampling for diffusion-based robot control."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
lerobot = [
  "lerobot==0.4.4",
]
dev = [
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factory_diffusion"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
