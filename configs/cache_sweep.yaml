# Initial feasibility sweep. Final values must be selected from an uncached
# residual trace rather than copied from video-generation experiments.
baseline:
  scheduler: ddim
  inference_steps: [10, 20, 50, 100]
  compile: [false, true]

adaptive_cache:
  # Action U-Net values are on a different scale from Wan video-model values.
  # The 0.075-0.15 region is the first observed skip region in the pinned
  # keypoint checkpoint; each new policy still needs its own uncached probe.
  thresholds: [0.0, 0.03, 0.05, 0.075, 0.1, 0.15, 0.25]
  warmup_steps: [2]
  force_compute_last: [2]
  max_consecutive_skips: [1, 2, 4]

evaluation:
  paired_seeds: true
  fixed_initial_noise: true
  report:
    - median_latency_ms
    - p95_latency_ms
    - denoiser_calls
    - skip_fraction
    - action_mse
    - first_action_max_error
    - task_success_rate
